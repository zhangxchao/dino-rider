<!doctype html><html><body style="margin:0;background:transparent">
<script type="module">
import * as THREE from 'three';
import { DINOS, RIDERS } from '../src/data.js';
import { createDinoModel } from '../src/models/dinos.js';
import { createRiderModel } from '../src/models/riders.js';
const Q = new URLSearchParams(location.search);
const W = 1400, H = 1000;
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.15;
renderer.setClearColor(0, 0);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xfff4e0, 0x404050, 1.5));
const key = new THREE.DirectionalLight(0xffffff, 2.6); key.position.set(5, 10, 7); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048); Object.assign(key.shadow.camera, { left: -8, right: 8, top: 8, bottom: -8 }); scene.add(key);
const rim = new THREE.DirectionalLight(0x9fd0ff, 2.0); rim.position.set(-6, 5, -7); scene.add(rim);
const rim2 = new THREE.DirectionalLight(0xff7a50, 1.0); rim2.position.set(7, 2, -5); scene.add(rim2);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.ShadowMaterial({ opacity: 0.35 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const d = DINOS.find((x) => x.id === Q.get('d')), r = RIDERS.find((x) => x.id === Q.get('r'));
const m = createDinoModel(d), rd = createRiderModel(r);
rd.root.scale.setScalar(d.riderScale || 1); m.saddle.add(rd.root);
m.root.traverse((o) => { if (o.isMesh) o.castShadow = true; });
scene.add(m.root);
const s = { t: 0.3, move: 0.6, air: false, attack: -1, skill: -1, hurt: 0, dead: 0 };
const rs = { t: 0.3, bounce: 0, shoot: -1, cheer: true, lean: 0 };
const k = +(new URLSearchParams(location.search).get('t') || 0.4);
for (let i = 0; i < 20; i++) { s.t += 0.02; rs.t += 0.02; m.update(0.02, s); rd.update(0.02, rs); }
m.root.updateMatrixWorld(true);
const box = new THREE.Box3().setFromObject(m.root), c = new THREE.Vector3(), z = new THREE.Vector3();
box.getCenter(c); box.getSize(z);
const cam = new THREE.PerspectiveCamera(26, W / H, 0.1, 500);
const dist = z.length() * 0.5 / Math.sin(THREE.MathUtils.degToRad(13)) * 0.78;
const dir = new THREE.Vector3(1, 0.32, 0.75).normalize();
cam.position.copy(c).addScaledVector(dir, dist); cam.lookAt(c.x, c.y - z.y * 0.05, c.z);
renderer.render(scene, cam);
window.__img = renderer.domElement.toDataURL('image/png');
</script></body></html>
